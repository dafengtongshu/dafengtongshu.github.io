<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大风吹倒梧桐树 · 管理端</title>
  <style>
:root {
  --bg: #f7f5ef;
  --bg-deep: #eeebe3;
  --surface: #ffffff;
  --surface-soft: #fbfaf7;
  --ink: #171a17;
  --ink-2: #3f443e;
  --muted: #82877e;
  --line: #e8e5dc;
  --line-strong: #d9d5ca;
  --accent: #266552;
  --accent-deep: #183f33;
  --accent-soft: #e4efe9;
  --accent-wash: #f1f7f3;
  --danger: #a94833;
  --danger-soft: #f8e8e3;
  --amber: #9c6b22;
  --amber-soft: #f8efdd;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 18px 60px rgba(28, 37, 30, 0.08);
  --font: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-sans-serif, sans-serif;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(900px 500px at 92% -10%, rgba(38, 101, 82, 0.08), transparent 60%),
    radial-gradient(700px 500px at -10% 50%, rgba(156, 107, 34, 0.05), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }
a { color: inherit; text-decoration: none; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.hidden { display: none !important; }
.muted-line { color: var(--muted); font-size: 13px; }

/* Boot */
.boot {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-content: center; gap: 10px;
  background: var(--bg);
  text-align: center;
}
.boot-mark { font-family: var(--serif); font-size: 30px; letter-spacing: 0.04em; color: var(--accent-deep); }
.boot-sub { color: var(--muted); font-size: 13px; letter-spacing: 0.12em; }

/* Auth */
.auth-screen {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(400px, 0.92fr);
}
.auth-art {
  position: relative;
  overflow: hidden;
  padding: 56px clamp(32px, 6vw, 92px);
  background: var(--accent-deep);
  color: #f4f1e8;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.auth-art::before {
  content: "";
  position: absolute;
  width: 560px; height: 560px;
  right: -180px; top: -140px;
  border: 1px solid rgba(244, 241, 232, 0.22);
  border-radius: 50%;
  box-shadow: inset 0 0 0 40px rgba(244, 241, 232, 0.04), inset 0 0 0 80px rgba(244, 241, 232, 0.03);
}
.auth-art::after {
  content: "";
  position: absolute;
  width: 1px; height: 70%;
  right: 16%; bottom: 0;
  background: linear-gradient(to bottom, transparent, rgba(244, 241, 232, 0.25), transparent);
  transform: rotate(18deg);
}
.brand-mark {
  position: relative; z-index: 1;
  font-family: var(--serif);
  font-size: 21px;
  letter-spacing: 0.12em;
  opacity: 0.9;
}
.auth-copy { position: relative; z-index: 1; max-width: 520px; padding: 8vh 0; }
.eyebrow {
  font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(244, 241, 232, 0.58); margin-bottom: 26px;
}
.auth-copy h1 {
  margin: 0 0 24px;
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(44px, 6vw, 76px);
  line-height: 1.12;
  letter-spacing: 0.015em;
}
.auth-copy p {
  margin: 0;
  color: rgba(244, 241, 232, 0.68);
  font-size: 15px;
  line-height: 2;
  max-width: 420px;
}
.auth-foot { position: relative; z-index: 1; color: rgba(244, 241, 232, 0.45); font-size: 12px; letter-spacing: 0.18em; }

.auth-panel {
  display: grid; place-items: center;
  padding: 40px clamp(24px, 5vw, 72px);
  background: var(--surface);
}
.auth-panel-inner { width: min(100%, 400px); }
.auth-head { margin-bottom: 34px; }
.auth-logo { font-family: var(--serif); font-size: 26px; letter-spacing: 0.06em; color: var(--ink); }
.auth-sub { color: var(--muted); font-size: 12px; letter-spacing: 0.12em; margin-top: 8px; }
.auth-tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.auth-tab {
  background: transparent; border: 0; padding: 0 0 12px;
  color: var(--muted); font-size: 14px; position: relative;
}
.auth-tab.active { color: var(--ink); font-weight: 600; }
.auth-tab.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--accent);
}
.auth-form { display: grid; gap: 18px; }
.form-note { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
.form-error {
  margin-top: 16px; padding: 11px 13px; border-radius: 10px;
  background: var(--danger-soft); color: var(--danger);
  font-size: 13px; line-height: 1.6;
}
.field { display: grid; gap: 7px; }
.field > span { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.field > span em { font-style: normal; color: var(--danger); margin-left: 4px; }
.field input, .field textarea, .field select, .search-wrap input {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 11px;
  background: var(--surface-soft); padding: 11px 13px;
  outline: none; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.field input:focus, .field textarea:focus, .field select:focus, .search-wrap input:focus {
  border-color: var(--accent); background: #fff;
  box-shadow: 0 0 0 3px rgba(38, 101, 82, 0.08);
}
.field textarea { resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.primary-btn {
  border: 0; border-radius: 999px; background: var(--accent); color: #fff;
  padding: 10px 20px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
  transition: background 0.15s, transform 0.1s;
}
.primary-btn:hover { background: var(--accent-deep); }
.primary-btn:active { transform: translateY(1px); }
.primary-btn.full { width: 100%; padding: 12px 18px; }
.ghost-btn {
  border: 1px solid var(--line-strong); background: transparent; border-radius: 999px;
  padding: 8px 15px; color: var(--ink-2); font-size: 13px;
}
.ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
.text-btn { border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 0; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--bg-deep); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }

/* Shell */
.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 224px minmax(0, 640px) 286px;
  justify-content: center;
  gap: 22px;
  padding: 0 24px;
  max-width: 1280px;
  margin: 0 auto;
}
.sidebar {
  position: sticky; top: 0; align-self: start;
  height: 100vh; padding: 26px 4px 22px 0;
  display: flex; flex-direction: column; gap: 18px;
}
.sidebar-top { padding: 4px 10px 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-sigil {
  width: 38px; height: 38px; border-radius: 12px; background: var(--accent);
  display: grid; place-items: center; color: #f5f2e8; flex: none;
}
.brand-sigil svg { width: 22px; height: 22px; stroke-width: 1.5; }
.brand-text { display: grid; line-height: 1.2; }
.brand-text strong { font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: 0.04em; }
.brand-text small { font-size: 10px; color: var(--muted); letter-spacing: 0.22em; margin-top: 4px; }
.side-nav { display: grid; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  width: 100%; border: 0; background: transparent; color: var(--ink-2);
  padding: 11px 13px; border-radius: 12px; text-align: left; font-size: 14px;
  position: relative;
}
.nav-item svg { width: 19px; height: 19px; color: var(--muted); }
.nav-item:hover { background: rgba(255,255,255,0.6); }
.nav-item.active { background: var(--surface); color: var(--accent-deep); font-weight: 600; box-shadow: 0 2px 10px rgba(28,37,30,0.04); }
.nav-item.active svg { color: var(--accent); }
.nav-count {
  margin-left: auto; min-width: 18px; height: 18px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 10px; font-style: normal;
  display: grid; place-items: center; padding: 0 5px;
}
.compose-btn {
  margin: 2px 8px 0;
  border: 0; border-radius: 14px; background: var(--accent); color: #fff;
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 10px 24px rgba(38, 101, 82, 0.18);
}
.compose-btn:hover { background: var(--accent-deep); }
.compose-btn svg { width: 17px; height: 17px; }
.sidebar-user { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); }
.user-chip { display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 7px 6px; }
.user-chip:hover { background: rgba(255,255,255,0.65); }
.avatar {
  width: 38px; height: 38px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 16px; color: #fff;
  background: var(--accent);
  overflow: hidden;
}
.avatar.sm { width: 28px; height: 28px; font-size: 12px; }
.avatar.lg { width: 66px; height: 66px; font-size: 24px; }
.user-chip-text { min-width: 0; display: grid; line-height: 1.25; }
.user-chip-text strong { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-chip-text small { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.user-chip-more { margin-left: auto; color: var(--muted); }

.page {
  min-height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  padding-bottom: 60px;
}
.mobile-top, .mobile-nav { display: none; }

/* Page header */
.page-head {
  padding: 22px 24px 0;
}
.page-kicker { font-size: 10px; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; }
.page-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 6px; }
.page-title { margin: 0; font-family: var(--serif); font-size: 29px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.2; }
.page-sub { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 430px; }
.page-tools { display: flex; gap: 8px; align-items: center; }
.head-rule { height: 1px; background: var(--line); margin: 20px 24px 0; }

/* Feed */
.feed { padding: 0 24px; }
.feed-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); }
.feed-tab { border: 0; background: transparent; padding: 15px 0 13px; color: var(--muted); font-size: 13px; position: relative; }
.feed-tab.active { color: var(--ink); font-weight: 600; }
.feed-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.post {
  padding: 20px 2px 18px;
  border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px;
}
.post:hover { background: linear-gradient(to right, rgba(241,247,243,0.5), transparent 70%); }
.post-body { min-width: 0; }
.post-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.post-name { color: var(--ink); font-weight: 600; font-size: 13px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; line-height: 1; padding: 4px 7px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent-deep); white-space: nowrap;
}
.badge.owner { background: #ede7d8; color: #6e5727; }
.badge.official { background: var(--accent-soft); color: var(--accent); }
.badge.custom { background: #eeeaf5; color: #5c4b7c; }
.badge.muted { background: var(--bg-deep); color: var(--muted); }
.post-scope { color: var(--accent); }
.post-content {
  margin: 7px 0 11px; white-space: pre-wrap; word-break: break-word;
  font-size: 15px; line-height: 1.72; color: var(--ink);
}
.post-image {
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 2px 0 12px;
  background: var(--bg-deep); max-height: 420px;
}
.post-image img { display: block; width: 100%; max-height: 420px; object-fit: cover; }
.post-actions { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.action-btn {
  border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 6px; border-radius: 8px; font-size: 12px;
}
.action-btn:hover { color: var(--accent); background: var(--accent-wash); }
.action-btn svg { width: 17px; height: 17px; }
.action-btn.liked { color: var(--accent); }
.post-status {
  margin-left: auto; font-size: 10px; letter-spacing: 0.03em;
  color: var(--amber); background: var(--amber-soft); padding: 4px 8px; border-radius: 99px;
}
.post-status.rejected { color: var(--danger); background: var(--danger-soft); }
.post-status.approved { color: var(--accent); background: var(--accent-soft); }

.empty-state {
  padding: 46px 10px; text-align: center; color: var(--muted);
}
.empty-mark { font-family: var(--serif); font-size: 35px; color: var(--line-strong); margin-bottom: 10px; }
.empty-state p { margin: 0; font-size: 13px; }
.loading-block { padding: 34px 24px; }
.skeleton-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--bg-deep), #f6f4ee, var(--bg-deep)); background-size: 200% 100%; animation: shimmer 1.5s infinite; margin-bottom: 12px; width: 72%; }
.skeleton-line.wide { width: 90%; height: 22px; }
.skeleton-line.short { width: 45%; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Channel list */
.channel-grid { padding: 18px 24px 0; display: grid; gap: 12px; }
.channel-row {
  display: flex; gap: 14px; align-items: center;
  padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface-soft);
  transition: border-color .15s, background .15s, transform .15s;
}
.channel-row:hover { border-color: var(--line-strong); background: #fff; transform: translateY(-1px); }
.channel-avatar {
  width: 48px; height: 48px; border-radius: 14px; flex: none;
  display: grid; place-items: center; color: var(--accent-deep);
  background: var(--accent-wash); border: 1px solid #d7e8df;
  font-family: var(--serif); font-size: 19px;
}
.channel-info { min-width: 0; flex: 1; }
.channel-name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
.channel-desc { color: var(--muted); font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.channel-meta { display: flex; gap: 10px; color: var(--muted); font-size: 11px; margin-top: 6px; }
.channel-row .ghost-btn { flex: none; }
.section-head { padding: 26px 24px 0; display: flex; justify-content: space-between; align-items: center; }
.section-head h2 { margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.section-head .muted-line { margin-top: 3px; }

/* Post detail */
.post-detail { padding: 22px 24px; border-bottom: 1px solid var(--line); }
.post-detail .post { border: 0; padding-top: 4px; }
.post-detail-head { display: flex; gap: 12px; align-items: center; }
.detail-rule { height: 1px; background: var(--line); margin: 18px 24px 0; }
.comment-list { padding: 0 24px; }
.comment { padding: 17px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
.comment-body { min-width: 0; }
.comment-meta { display: flex; gap: 7px; align-items: center; color: var(--muted); font-size: 11px; }
.comment-text { margin: 5px 0 0; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.comment-form { padding: 18px 24px 0; display: grid; gap: 10px; }
.comment-form textarea {
  width: 100%; min-height: 74px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 12px;
  background: var(--surface-soft); padding: 11px 13px; outline: none;
}
.comment-form textarea:focus { border-color: var(--accent); background: #fff; }
.comment-form .primary-btn { justify-self: end; }
.comment-form-note { color: var(--muted); font-size: 11px; margin: 0; }

/* Profile */
.profile-hero { padding: 26px 24px 20px; border-bottom: 1px solid var(--line); }
.profile-top { display: flex; align-items: flex-start; gap: 16px; }
.profile-main { min-width: 0; flex: 1; }
.profile-name { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.profile-name h1 { margin: 0; font-family: var(--serif); font-size: 28px; font-weight: 600; }
.profile-handle { color: var(--muted); font-size: 12px; margin-top: 5px; }
.profile-stat-row { display: flex; gap: 20px; margin-top: 15px; color: var(--muted); font-size: 12px; }
.profile-stat-row strong { color: var(--ink); font-weight: 600; }
.profile-tabs { display: flex; gap: 26px; padding: 15px 24px 0; border-bottom: 1px solid var(--line); }
.profile-tab { border: 0; background: transparent; padding: 0 0 12px; color: var(--muted); font-size: 13px; position: relative; }
.profile-tab.active { color: var(--ink); font-weight: 600; }
.profile-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.profile-feed { padding: 0 24px; }
.profile-actions { display: flex; gap: 8px; }

/* Notifications */
.notice-list { padding: 8px 24px 0; }
.notice-item { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 11px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.notice-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); }
.notice-icon svg { width: 15px; height: 15px; }
.notice-title { font-size: 13px; line-height: 1.5; }
.notice-time { color: var(--muted); font-size: 11px; margin-top: 3px; }

/* Rightbar */
.rightbar { padding: 26px 0 0; display: grid; align-content: start; gap: 16px; position: sticky; top: 0; height: 100vh; }
.right-card { background: rgba(255,255,255,0.65); border: 1px solid var(--line); border-radius: 16px; padding: 15px; }
.search-card { padding: 10px; background: transparent; border-color: transparent; }
.search-wrap { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.72); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search-wrap svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.search-wrap input { border: 0; background: transparent; padding: 10px 0; font-size: 12px; box-shadow: none; }
.search-wrap input:focus { box-shadow: none; }
.right-card-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; margin-bottom: 11px; }
.mini-channel { display: flex; gap: 9px; align-items: center; padding: 8px 0; }
.mini-channel + .mini-channel { border-top: 1px solid var(--line); }
.mini-channel .channel-avatar { width: 31px; height: 31px; border-radius: 9px; font-size: 13px; }
.mini-channel-name { font-size: 12px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-channel-meta { font-size: 10px; color: var(--muted); margin-top: 2px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-note { padding: 18px; background: var(--accent-deep); border-color: transparent; color: rgba(244,241,232,0.86); }
.note-kicker { font-size: 9px; letter-spacing: 0.2em; color: rgba(244,241,232,0.45); }
.site-note p { font-family: var(--serif); font-size: 16px; line-height: 1.8; margin: 11px 0 13px; }
.note-sign { font-size: 11px; color: rgba(244,241,232,0.55); text-align: right; }
.right-foot { color: var(--muted); font-size: 10px; display: flex; gap: 6px; padding: 0 4px; }

.settings-card { width: min(100%, 680px); }
.settings-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.settings-section-head > span:first-child { font-size: 13px; font-weight: 600; }
.settings-section-head .muted-line { font-size: 11px; }
.settings-role-list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.settings-role { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); padding: 11px 12px; }
.settings-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
.settings-role-main { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; min-width: 0; }
.settings-role-main strong { font-size: 13px; }
.settings-perms { width: 100%; color: var(--muted); font-size: 11px; }
.settings-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 3px 0; }
.settings-checks .check-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-soft); }
.settings-checks input[type="checkbox"] { width: 16px; height: 16px; min-height: 0; padding: 0; border: 1px solid var(--line-strong); border-radius: 4px; accent-color: var(--accent); flex: none; }
.settings-member-list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.settings-member { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); padding: 10px 12px; }
.settings-member strong { font-size: 13px; }
.settings-member-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
.settings-member select { width: 140px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface-soft); padding: 7px 8px; font-size: 12px; }
@media (max-width: 640px) { .settings-checks { grid-template-columns: 1fr; } .settings-member select { width: 120px; } }

/* Modals */
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 22px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(23, 26, 23, 0.36); backdrop-filter: blur(4px); }
.modal-card {
  position: relative; width: min(100%, 560px); max-height: 90vh; overflow: auto;
  background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow);
}
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
.modal-title { font-family: var(--serif); font-size: 22px; font-weight: 600; }
.modal-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.stack-form { display: grid; gap: 15px; }
.compose-context {
  display: flex; align-items: center; gap: 8px; margin: -6px 0 12px;
  color: var(--accent); font-size: 12px;
}
.compose-text {
  width: 100%; min-height: 180px; resize: vertical; border: 1px solid var(--line-strong);
  border-radius: 14px; background: var(--surface-soft); padding: 14px 15px; outline: none;
  font-family: var(--serif); font-size: 18px; line-height: 1.8;
}
.compose-text:focus { border-color: var(--accent); background: #fff; }
.compose-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 14px; }
.compose-tools { display: flex; align-items: center; gap: 12px; }
.tool-btn { border: 0; background: transparent; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; font-size: 12px; padding: 5px 6px; border-radius: 8px; }
.tool-btn:hover { color: var(--accent); background: var(--accent-wash); }
.tool-btn svg { width: 17px; height: 17px; }
.count { color: var(--muted); font-size: 11px; }
.compose-preview { margin-top: 13px; border: 1px solid var(--line); border-radius: 13px; padding: 10px; display: flex; align-items: center; gap: 12px; background: var(--surface-soft); }
.compose-preview img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; }
.compose-preview .remove-img { margin-left: auto; border: 0; background: transparent; color: var(--danger); font-size: 12px; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 34px; z-index: 100; transform: translateX(-50%);
  background: var(--ink); color: #f6f3ea; padding: 11px 17px; border-radius: 99px;
  font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); max-width: 90vw;
}
.toast.error { background: var(--danger); }
.toast.good { background: var(--accent-deep); }

/* Small helpers */
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.load-more { display: block; width: 100%; text-align: center; color: var(--accent); font-size: 12px; padding: 18px; border: 0; background: transparent; }

@media (max-width: 1040px) {
  .app-shell { grid-template-columns: 210px minmax(0, 1fr); max-width: 1000px; }
  .rightbar { display: none; }
}

    padding: 7px 14px 9px; align-items: center; justify-content: space-around;

:root {

.admin-login-card p { color: var(--admin-muted); font-size: 12px; line-height: 1.9; margin: 0 0 22px; }

.admin-shell { min-height: 100vh; }

.admin-nav-count { margin-left: auto; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; display: grid; place-items: center; background: var(--admin-accent); color: #fff; font-size: 10px; font-style: normal; }
.admin-side-foot { margin-top: auto; padding: 18px 12px 0; border-top: 1px solid var(--admin-line); }

.admin-main { padding: 30px 34px 60px; min-width: 0; }

.admin-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
.admin-kicker { font-size: 10px; letter-spacing: 0.22em; color: var(--admin-muted); }
.admin-page-title { margin: 6px 0 0; font-family: var(--serif); font-size: 30px; font-weight: 600; }

.admin-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.stat-label { color: var(--admin-muted); font-size: 10px; letter-spacing: 0.08em; }
.stat-value { font-family: var(--serif); font-size: 29px; font-weight: 600; line-height: 1.15; margin-top: 7px; }

.admin-card { background: var(--admin-surface); border: 1px solid var(--admin-line); border-radius: 16px; overflow: hidden; }

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const safe = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const normalizeUsername = (value) => String(value || '').trim().toLowerCase();

  async function syntheticEmail(username) {
    const normalized = normalizeUsername(username);
    const bytes = new TextEncoder().encode(normalized);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    const hex = Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    return `u_${hex}@yunliao.cn`;
  }

  function initials(name) {
    const value = String(name || '?').trim();
    if (!value) return '?';
    return value.slice(0, 1).toUpperCase();
  }

  const avatarPalette = ['#266552', '#3e5d72', '#6b5641', '#5b566d', '#3d6b4e', '#7a4d44'];
  function avatarColor(name) {
    let sum = 0;
    for (const ch of String(name || '')) sum = (sum + ch.codePointAt(0)) % 997;
    return avatarPalette[sum % avatarPalette.length];
  }

  function avatarHtml(name, extra = '', style = '') {
    return `<span class="avatar ${extra}" style="background:${avatarColor(name)};${style}">${safe(initials(name))}</span>`;
  }

  function timeAgo(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    const now = new Date();
    const diff = Math.max(0, now - date);
    const min = Math.floor(diff / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return `${min} 分钟前`;
    const hours = Math.floor(min / 60);
    if (hours < 24) return `${hours} 小时前`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days} 天前`;
    const sameYear = now.getFullYear() === date.getFullYear();
    return `${date.getMonth() + 1}月${date.getDate()}日${sameYear ? '' : ` ${date.getFullYear()}`}`;
  }

  let toastTimer = null;
  function toast(message, kind = '') {
    const el = $('#toast');
    if (!el) return;
    el.textContent = message;
    el.className = `toast ${kind}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
  }

  function showError(el, message) {
    if (!el) return;
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function hideError(el) {
    if (!el) return;
    el.textContent = '';
    el.classList.add('hidden');
  }

  function openModal(name) {
    const el = document.getElementById(`${name}-modal`);
    if (el) el.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(name) {
    const el = document.getElementById(`${name}-modal`);
    if (el) el.classList.add('hidden');
    document.body.style.overflow = '';
  }

  async function getSession() {
    const { data } = await sb.auth.getSession();
    return data?.session || null;
  }

  async function getMyProfile() {
    const session = await getSession();
    if (!session) return null;
    const { data, error } = await sb.from('profiles')
      .select('id,username,email,role,status,site_role_id,invited_code_id,created_at,last_seen_at')
      .eq('id', session.user.id)
      .maybeSingle();
    if (error) throw error;
    return data;
  }

  async function loadSiteRoles() {
    const { data, error } = await sb.from('site_roles').select('*').order('sort_order', { ascending: true });
    if (error) throw error;
    return data || [];
  }

  function roleName(role) {
    return role?.name || '普通用户';
  }
  function roleBadge(role) {
    if (!role) return '';
    const text = role.badge_text || role.name || '普通用户';
    const cls = role.is_system && role.name === '站主' ? 'owner'
      : role.is_system && role.name === '官方管理员' ? 'official' : 'custom';
    return `<span class="badge ${cls}">${safe(text)}</span>`;
  }
  function roleHas(role, permission) {
    if (!role) return false;
    if (!Array.isArray(role.permissions)) return false;
    return role.permissions.includes(permission);
  }

  function scopeLabel(scope) {
    return scope === 'channel' ? '频道' : '大厅';
  }

  async function signedImage(path) {
    if (!path) return '';
    const { data, error } = await sb.storage.from('forum-media').createSignedUrl(path, 3600);
    if (error) return '';
    return data?.signedUrl || '';
  }

  // 本地规则的轻量提示，最终以数据库规则与站主审核为准。
  const localRules = [
    { label: '疑似诈骗引流', level: 'medium', re: /(刷单|返利|博彩|下注|贷款|代开发票|加微信|加qq|私聊领|内部渠道|稳赚|日入过万)/i },
    { label: '疑似暴力血腥', level: 'high', re: /(血腥|虐杀|砍人|爆头|自杀|尸体|肢解)/i },
    { label: '疑似低俗内容', level: 'low', re: /(约炮|裸聊|色情|成人视频)/i },
    { label: '疑似恶意引流', level: 'low', re: /(https?:\/\/|www\.|扫码|二维码|点击链接)/i }
  ];
  function localCheck(content) {
    const labels = [];
    let level = 'none';
    for (const rule of localRules) {
      if (rule.re.test(String(content || ''))) {
        labels.push(rule.label);
        if (rule.level === 'high') level = 'high';
        else if (rule.level === 'medium' && level !== 'high') level = 'medium';
        else if (level === 'none') level = 'low';
      }
    }
    return { level, labels };
  }

  function debounce(fn, wait = 260) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), wait);
    };
  }

  window.Forum = {
    sb, cfg, $, $$, safe, normalizeUsername, syntheticEmail, initials, avatarColor, avatarHtml,
    timeAgo, toast, showError, hideError, openModal, closeModal, getSession, getMyProfile,
    loadSiteRoles, roleName, roleBadge, roleHas, scopeLabel, signedImage, localCheck, debounce
  };
})();

</script>
  <script>
/* 大风吹倒梧桐树 · 独立管理端 */
(() => {
  const F = window.Forum;
  const { sb, $, $$, safe, normalizeUsername, syntheticEmail, avatarHtml, timeAgo, toast,
    showError, hideError, openModal, closeModal, getSession, getMyProfile, loadSiteRoles,
    roleName, roleBadge, roleHas, debounce } = F;

  const PERMISSIONS = [
    ['site.content.review', '审核内容'],
    ['site.content.remove', '删除内容'],
    ['site.user.view', '查看用户'],
    ['site.user.ban', '封禁用户'],
    ['site.channel.manage', '管理频道'],
    ['site.role.manage', '管理角色'],
    ['site.rule.manage', '管理检测规则'],
    ['site.invite.manage', '管理邀请码'],
    ['site.audit.view', '查看操作日志'],
    ['site.settings.manage', '站点设置']
  ];

  const state = {
    me: null, roles: [], roleMap: new Map(), tab: 'overview', reviewType: 'posts',
    counts: {}, channels: [], reviewAction: null, userQuery: ''
  };
  const role = () => state.roleMap.get(state.me?.site_role_id) || { name: '普通用户', permissions: [] };
  const can = (permission) => role().name === '站主' || roleHas(role(), permission);

  function setBoot(show) { $('#admin-boot')?.classList.toggle('hidden', !show); }
  function showLogin() {
    setBoot(false);
    $('#admin-shell')?.classList.add('hidden');
    $('#admin-login')?.classList.remove('hidden');
    hideError($('#admin-login-error'));
  }

  function bindLogin() {
    $('#admin-login-form')?.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = normalizeUsername($('#admin-username')?.value);
      const password = $('#admin-password')?.value || '';
      const err = $('#admin-login-error');
      hideError(err);
      if (!username || !password) return showError(err, '请填写用户名和密码。');
      const btn = event.submitter;
      if (btn) { btn.disabled = true; btn.textContent = '正在进入…'; }
      try {
        const email = await syntheticEmail(username);
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await bootAdmin();
      } catch (e) {
        showError(err, '登录失败：用户名或密码不正确。');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '进入管理端'; }
      }
    });
  }

  async function bootAdmin() {
    const session = await getSession();
    if (!session) return showLogin();
    state.me = await getMyProfile();
    state.roles = await loadSiteRoles();
    state.roleMap = new Map(state.roles.map((r) => [r.id, r]));
    if (!can('site.content.review') && !can('site.user.view') && !can('site.invite.manage') && !can('site.channel.manage') && role().name !== '站主') {
      showLogin();
      showError($('#admin-login-error'), '当前账号没有管理权限，请联系站主。');
      await sb.auth.signOut();
      return;
    }
    setBoot(false);
    $('#admin-login')?.classList.add('hidden');
    $('#admin-shell')?.classList.remove('hidden');
    renderTopbar();
    await loadAdminChannels();
    await renderAdmin('overview');
  }

  function renderTopbar() {
    const el = $('#admin-role-badge');
    if (el) { el.textContent = role().badge_text || role().name; el.className = `badge ${role().name === '站主' ? 'owner' : 'official'}`; }
    const name = $('#admin-user-name'); if (name) name.textContent = state.me.username;
  }

  async function loadAdminChannels() {
    const { data } = await sb.from('channels').select('id,name,slug,status,owner_id,visibility,join_policy,created_at').order('created_at', { ascending: false }).limit(200);
    state.channels = data || [];
  }

  async function refreshCounts() {
    const [posts, comments, channels, users, invites, reports] = await Promise.all([
      sb.from('posts').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('comments').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('channels').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('profiles').select('id', { count: 'exact', head: true }),
      sb.from('invite_codes').select('id', { count: 'exact', head: true }).eq('status', 'active'),
      sb.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'pending')
    ]);
    state.counts = {
      pendingPosts: posts.count || 0, pendingComments: comments.count || 0, pendingChannels: channels.count || 0,
      users: users.count || 0, activeInvites: invites.count || 0, reports: reports.count || 0
    };
    const badge = $('#admin-pending-count');
    const total = state.counts.pendingPosts + state.counts.pendingComments + state.counts.pendingChannels;
    if (badge) { badge.textContent = String(total); badge.classList.toggle('hidden', total === 0); }
    const reportBadge = $('#admin-report-count');
    if (reportBadge) { reportBadge.textContent = String(state.counts.reports); reportBadge.classList.toggle('hidden', state.counts.reports === 0); }
  }

  function setTab(tab) {
    state.tab = tab;
    $$('.admin-nav-item').forEach((el) => el.classList.toggle('active', el.dataset.tab === tab));
    renderAdmin(tab);
  }

  async function renderAdmin(tab) {
    const page = $('#admin-page');
    if (!page) return;
    page.innerHTML = '<div class="admin-loading"><div class="skeleton-line wide"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>';
    try {
      if (tab === 'overview') await renderOverview();
      else if (tab === 'review') await renderReview();
      else if (tab === 'reports') await renderReports();
      else if (tab === 'users') await renderUsers();
      else if (tab === 'invites') await renderInvites();
      else if (tab === 'channels') await renderChannelsAdmin();
      else if (tab === 'rules') await renderRules();
      else if (tab === 'audit') await renderAudit();
    } catch (e) {
      console.error(e);
      page.innerHTML = `<div class="admin-page-head"><div><div class="admin-kicker">ERROR</div><h1 class="admin-page-title">出错了</h1><p class="admin-page-sub">${safe(String(e?.message || '未知错误').slice(0, 180))}</p></div></div>`;
    }
  }

  function head(kicker, title, sub, tools = '') {
    return `<div class="admin-page-head"><div><div class="admin-kicker">${safe(kicker)}</div><h1 class="admin-page-title">${safe(title)}</h1>${sub ? `<p class="admin-page-sub">${safe(sub)}</p>` : ''}</div><div class="page-tools">${tools}</div></div><hr class="admin-rule" />`;
  }

  async function renderOverview() {
    await refreshCounts();
    const counts = state.counts;
    const page = $('#admin-page');
    page.innerHTML = `${head('OVERVIEW / 概览', '今天，风往哪边吹。', '先把待审的内容处理掉，再决定下一步。', `<button class="primary-btn" data-admin-tab="review" type="button">去审核</button>`)}
      <div class="admin-grid">
        <div class="stat-card hot"><div class="stat-label">待审帖子</div><div class="stat-value">${counts.pendingPosts}</div><div class="stat-note">发布前先到你这里</div></div>
        <div class="stat-card"><div class="stat-label">待审评论</div><div class="stat-value">${counts.pendingComments}</div><div class="stat-note">和帖子分开审</div></div>
        <div class="stat-card"><div class="stat-label">待审频道</div><div class="stat-value">${counts.pendingChannels}</div><div class="stat-note">频道通过后才公开</div></div>
        <div class="stat-card"><div class="stat-label">注册用户</div><div class="stat-value">${counts.users}</div><div class="stat-note">必须持邀请码注册</div></div>
      </div>
      <div class="admin-section" style="margin-top:18px">
        <div class="admin-section-head"><h2>待办</h2><span class="muted-line">越靠前越急</span></div>
        <div class="admin-card"><div class="admin-card-body">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--admin-line)"><div><div class="stat-label">待审帖子</div><div class="muted-line" style="margin-top:3px">所有内容先审后发</div></div><div style="display:flex;align-items:center;gap:10px"><strong style="font-family:var(--serif);font-size:20px">${counts.pendingPosts}</strong><button class="text-btn" data-admin-tab="review" type="button">处理 →</button></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--admin-line)"><div><div class="stat-label">待审评论</div><div class="muted-line" style="margin-top:3px">评论也不直接公开</div></div><div style="display:flex;align-items:center;gap:10px"><strong style="font-family:var(--serif);font-size:20px">${counts.pendingComments}</strong><button class="text-btn" data-admin-tab="review" type="button">处理 →</button></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0"><div><div class="stat-label">待审频道</div><div class="muted-line" style="margin-top:3px">通过后才出现在用户端</div></div><div style="display:flex;align-items:center;gap:10px"><strong style="font-family:var(--serif);font-size:20px">${counts.pendingChannels}</strong><button class="text-btn" data-admin-tab="review" type="button">处理 →</button></div></div>
        </div></div>
      </div>
      <div class="admin-section">
        <div class="admin-section-head"><h2>快捷入口</h2></div>
        <div class="admin-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
          <button class="admin-card" data-admin-tab="invites" type="button" style="text-align:left;cursor:pointer"><div class="admin-card-body"><div class="stat-label">邀请码</div><div class="stat-value" style="font-size:22px">${counts.activeInvites}</div><div class="stat-note">当前可用</div></div></button>
          <button class="admin-card" data-admin-tab="users" type="button" style="text-align:left;cursor:pointer"><div class="admin-card-body"><div class="stat-label">用户与角色</div><div class="stat-value" style="font-size:22px">${counts.users}</div><div class="stat-note">分配徽章和权限</div></div></button>
          <button class="admin-card" data-admin-tab="rules" type="button" style="text-align:left;cursor:pointer"><div class="admin-card-body"><div class="stat-label">检测规则</div><div class="stat-value" style="font-size:22px">本地</div><div class="stat-note">不接付费 API</div></div></button>
        </div>
      </div>`;
    refreshCounts().catch(() => {});
  }

  async function renderReview() {
    await refreshCounts();
    if (state.reviewType === 'posts' && state.counts.pendingPosts === 0) {
      if (state.counts.pendingComments > 0) state.reviewType = 'comments';
      else if (state.counts.pendingChannels > 0) state.reviewType = 'channels';
    }
    const type = state.reviewType;
    let items = [];
    if (type === 'posts') {
      const { data } = await sb.from('posts').select('id,scope,channel_id,author_id,content,status,risk_level,risk_labels,created_at').eq('status', 'pending').order('created_at', { ascending: true }).limit(50);
      const list = data || [];
      const ids = [...new Set(list.map((p) => p.author_id).filter(Boolean))];
      const { data: profiles } = ids.length ? await sb.from('public_profiles').select('id,username,site_role_id').in('id', ids) : { data: [] };
      const authors = new Map((profiles || []).map((p) => [p.id, p]));
      items = list.map((p) => ({ ...p, _author: authors.get(p.author_id) || { username: '未知用户' } }));
    } else if (type === 'comments') {
      const { data } = await sb.from('comments').select('id,post_id,author_id,content,status,created_at').eq('status', 'pending').order('created_at', { ascending: true }).limit(50);
      const list = data || [];
      const ids = [...new Set(list.map((c) => c.author_id).filter(Boolean))];
      const { data: profiles } = ids.length ? await sb.from('public_profiles').select('id,username').in('id', ids) : { data: [] };
      const authors = new Map((profiles || []).map((p) => [p.id, p]));
      items = list.map((c) => ({ ...c, _author: authors.get(c.author_id) || { username: '未知用户' } }));
    } else {
      const { data } = await sb.from('channels').select('id,name,slug,description,visibility,join_policy,post_policy,status,owner_id,created_at').eq('status', 'pending').order('created_at', { ascending: true }).limit(50);
      items = data || [];
    }
    const page = $('#admin-page');
    page.innerHTML = `${head('REVIEW / 审核队列', '过一遍，再放行。', '帖子、评论、频道都在这里。拒绝时要写原因。', `<button class="ghost-btn" data-admin-tab="overview" type="button">回概览</button>`)}
      <div class="admin-toolbar">
        <button class="admin-filter-btn ${type === 'posts' ? 'active' : ''}" data-admin-review-type="posts" type="button">帖子 ${state.counts.pendingPosts}</button>
        <button class="admin-filter-btn ${type === 'comments' ? 'active' : ''}" data-admin-review-type="comments" type="button">评论 ${state.counts.pendingComments}</button>
        <button class="admin-filter-btn ${type === 'channels' ? 'active' : ''}" data-admin-review-type="channels" type="button">频道 ${state.counts.pendingChannels}</button>
      </div>
      <div class="review-list">${items.length ? items.map((item) => reviewItem(type, item)).join('') : '<div class="admin-card"><div class="admin-empty">这一栏空了。风暂时停了。</div></div>'}</div>`;
  }

  function reviewItem(type, item) {
    if (type === 'posts') {
      const channel = state.channels.find((c) => c.id === item.channel_id);
      const risk = item.risk_labels?.length ? `<span class="risk-chip">${safe(item.risk_labels.join(' · '))}</span>` : '';
      return `<div class="review-item"><div class="review-item-main"><div class="review-meta"><span>${avatarHtml(item._author.username, 'sm')} <strong>${safe(item._author.username)}</strong></span><span>·</span><span>${safe(channel ? `#${channel.name}` : '大厅')}</span><span>·</span><span>${safe(timeAgo(item.created_at))}</span>${risk}</div><p class="review-content">${safe(item.content)}</p><div class="review-sub">帖子 ID：${safe(item.id)}</div></div><div class="review-actions"><button class="primary-btn" data-admin-action="approve" data-kind="posts" data-id="${safe(item.id)}" type="button">通过</button><button class="ghost-btn" data-admin-action="reject" data-kind="posts" data-id="${safe(item.id)}" type="button">拒绝</button></div></div>`;
    }
    if (type === 'comments') {
      return `<div class="review-item"><div class="review-item-main"><div class="review-meta"><span>${avatarHtml(item._author.username, 'sm')} <strong>${safe(item._author.username)}</strong></span><span>·</span><span>${safe(timeAgo(item.created_at))}</span></div><p class="review-content">${safe(item.content)}</p><div class="review-sub">评论 ID：${safe(item.id)} · 原帖：${safe(item.post_id)}</div></div><div class="review-actions"><button class="primary-btn" data-admin-action="approve" data-kind="comments" data-id="${safe(item.id)}" type="button">通过</button><button class="ghost-btn" data-admin-action="reject" data-kind="comments" data-id="${safe(item.id)}" type="button">拒绝</button></div></div>`;
    }
    return `<div class="review-item"><div class="review-item-main"><div class="review-meta"><span class="channel-avatar" style="width:28px;height:28px;border-radius:9px;font-size:12px">${safe(item.name.slice(0,1))}</span><strong>${safe(item.name)}</strong><span>·</span><span>/${safe(item.slug)}</span><span>·</span><span>${safe(item.visibility === 'private' ? '私密' : '公开')}</span></div><p class="review-content">${safe(item.description || '（没有简介）')}</p><div class="review-sub">${safe(item.join_policy === 'approval' ? '申请加入' : item.join_policy === 'invite' ? '仅邀请' : '直接加入')} · ${safe(item.post_policy === 'moderators' ? '仅管理员发帖' : '成员可发帖')} · 频道 ID：${safe(item.id)}</div></div><div class="review-actions"><button class="primary-btn" data-admin-action="approve" data-kind="channels" data-id="${safe(item.id)}" type="button">通过</button><button class="ghost-btn" data-admin-action="reject" data-kind="channels" data-id="${safe(item.id)}" type="button">拒绝</button></div></div>`;
  }

  async function doReview(kind, id, approve, note = '') {
    const fn = kind === 'posts' ? 'review_post' : kind === 'comments' ? 'review_comment' : 'review_channel';
    const arg = kind === 'posts' ? 'p_post' : kind === 'comments' ? 'p_comment' : 'p_channel';
    const { error } = await sb.rpc(fn, { [arg]: id, p_approve: approve, p_reason: note });
    if (error) throw error;
  }

  function openReject(kind, id) {
    state.reviewAction = { kind, id, approve: false };
    $('#admin-review-note').value = '';
    hideError($('#admin-review-error'));
    openModal('admin-review');

    if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }

  // ---------- reports ----------
  async function renderReports() {
    await refreshCounts();
    const { data } = await sb.from('reports')
      .select('id,reporter_id,target_type,target_id,reason,detail,status,created_at')
      .eq('status', 'pending').order('created_at', { ascending: true }).limit(60);
    const rows = data || [];
    const reporterIds = [...new Set(rows.map((r) => r.reporter_id).filter(Boolean))];
    const postIds = rows.filter((r) => r.target_type === 'post').map((r) => r.target_id);
    const commentIds = rows.filter((r) => r.target_type === 'comment').map((r) => r.target_id);
    const [profilesRes, postsRes, commentsRes] = await Promise.all([
      reporterIds.length ? sb.from('public_profiles').select('id,username').in('id', reporterIds) : Promise.resolve({ data: [] }),
      postIds.length ? sb.from('posts').select('id,content,status').in('id', postIds) : Promise.resolve({ data: [] }),
      commentIds.length ? sb.from('comments').select('id,content,status').in('id', commentIds) : Promise.resolve({ data: [] })
    ]);
    const reporters = new Map((profilesRes.data || []).map((p) => [p.id, p]));
    const posts = new Map((postsRes.data || []).map((p) => [p.id, p]));
    const comments = new Map((commentsRes.data || []).map((c) => [c.id, c]));
    const reasonMap = { spam: '垃圾广告', scam: '诈骗/引流', violence: '暴力血腥', harassment: '骚扰', other: '其他' };
    $('#admin-page').innerHTML = `${head('REPORTS / 举报', '有人按了提醒。', '举报不会自动删除内容，需要你判断后处理。', `<button class="ghost-btn" data-admin-tab="review" type="button">去审核内容</button>`)}
      <div class="review-list">${rows.length ? rows.map((r) => {
        const target = r.target_type === 'post' ? posts.get(r.target_id) : r.target_type === 'comment' ? comments.get(r.target_id) : null;
        const reporter = reporters.get(r.reporter_id) || { username: '未知用户' };
        return `<div class="review-item"><div class="review-item-main"><div class="review-meta"><span class="risk-chip">${safe(reasonMap[r.reason] || r.reason)}</span><span>${safe(timeAgo(r.created_at))}</span><span>·</span><span>举报人 ${safe(reporter.username)}</span><span>·</span><span>${safe(r.target_type)}</span></div><div class="review-content">${safe(r.detail || '（没有补充说明）')}</div><div class="review-sub">对象 ID：${safe(r.target_id)}${target?.content ? ` · 原文：${safe(String(target.content).slice(0, 120))}` : ''}</div></div><div class="review-actions"><button class="primary-btn" data-admin-action="resolve-report" data-id="${safe(r.id)}" data-status="resolved" type="button">标记处理</button><button class="ghost-btn" data-admin-action="resolve-report" data-id="${safe(r.id)}" data-status="dismissed" type="button">忽略</button></div></div>`;
      }).join('') : '<div class="admin-card"><div class="admin-empty">没有待处理举报。</div></div>'}</div>`;
  }

  async function resolveReport(id, status) {

    if (!badge || badge.length > 40) return showError(err, '徽章文案需要 1–40 个字符。');
    const btn = event.submitter;
    if (btn) { btn.disabled = true; btn.textContent = '创建中…'; }

  // ---------- events ----------
  function bindAdminEvents() {
    $$('.admin-nav-item').forEach((el) => el.addEventListener('click', () => setTab(el.dataset.tab)));
    $('#admin-logout')?.addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });
    document.addEventListener('click', async (event) => {
      const tabEl = event.target.closest('[data-admin-tab]');
      if (tabEl) { event.preventDefault(); setTab(tabEl.dataset.adminTab); return; }
      const typeEl = event.target.closest('[data-admin-review-type]');
      if (typeEl) { event.preventDefault(); state.reviewType = typeEl.dataset.adminReviewType; await renderReview(); return; }
      const actionEl = event.target.closest('[data-admin-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.adminAction;
      if (action === 'approve') { event.preventDefault(); approve(actionEl.dataset.kind, actionEl.dataset.id); }
      else if (action === 'reject') { event.preventDefault(); openReject(actionEl.dataset.kind, actionEl.dataset.id); }
      else if (action === 'new-role') { event.preventDefault(); openRoleModal(); }
      else if (action === 'resolve-report') { event.preventDefault(); resolveReport(actionEl.dataset.id, actionEl.dataset.status); }
      else if (action === 'copy-code') {
        event.preventDefault();
        try { await navigator.clipboard.writeText(actionEl.dataset.code); toast('邀请码已复制。', 'good'); }
        catch (e) { toast('复制失败，请手动选择。', 'error'); }
      }
    });
    document.addEventListener('change', async (event) => {
      const sel = event.target.closest('[data-admin-action="role-change"]');
      if (sel) await changeUserRole(sel.dataset.id, sel.value);
    });
    $$('[data-admin-close]').forEach((el) => el.addEventListener('click', () => closeModal(el.dataset.adminClose)));
    $$('.modal').forEach((modal) => modal.addEventListener('click', (event) => { if (event.target === modal) closeModal(modal.id.replace('-modal', '')); }));
    $('#admin-review-confirm')?.addEventListener('click', confirmReview);
    $('#admin-role-form')?.addEventListener('submit', createRole);
  }

  async function init() {
    bindLogin();
    bindAdminEvents();
    try {
      const session = await getSession();
      if (session) await bootAdmin(); else showLogin();
    } catch (e) {
      console.error(e);
      showLogin();
      showError($('#admin-login-error'), '初始化失败，请刷新页面。');
    }
  }

  init();
})();

</script>
</body>
</html>
